name: depbot

# depbot keeps this repository up to date with itself.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./
        with:
          # The default GITHUB_TOKEN cannot change workflow files, so actions
          # are updated separately with a token that has the workflows permission.
          ecosystems: gomod,docker
